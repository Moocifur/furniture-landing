<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Bumble's Furniture</title>
    <meta name="description" content="Ms. Bumle's Furniture: sofas, tables, and more for the way you live.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Ms. Bumble's Furniture</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Shop</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Hero -->
    <main>
        <section class="hero text-center text-white">
            <div class="container">
                <h1 id="headline" class="display-4 fw-bold">Furniture for the way you live</h1>
                <p class="lead">Fall sale: save up to 30% on sofas, tables, and more.</p>
                <a id="cta" href="#" class="btn btn-primary btn-lg">Shop the sale</a>
            </div>
        </section>
        <!-- Products -->
        <section class="py-5">
            <div class="container">
                <h2 class="text-center mb-4">Featured pieces</h2>
                <div id="products" class="row g-4"></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
    <script src="ab-test.js"></script>
</body>

</html>
